[project]
name = "qmd-py"
version = "0.1.0"
description = "Centralized markdown search over Postgres/pgvector, with an LLM search pipeline over HTTP — a from-scratch Python rewrite of qmd (github.com/tobi/qmd)"
readme = "README.md"
authors = [
    { name = "adalseno", email = "adalseno@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.2",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
marq = "qmd_py.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmd_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real Postgres/llama.cpp roundtrip tests (require QMD_POSTGRES_URL/QMD_LLM_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions"]
