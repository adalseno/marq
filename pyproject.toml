[project]
name = "qmd-py"
version = "0.1.0"
description = "marq: centralized markdown/code search over Postgres/pgvector, with a hybrid BM25+vector+rerank LLM search pipeline over HTTP and an MCP server for agents — inspired by qmd (github.com/tobi/qmd), rewritten from scratch in Python"
readme = "README.md"
authors = [
    { name = "adalseno", email = "adalseno@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 2.x: FastMCP became MCPServer (mcp.server.fastmcp ->
    # mcp.server.mcpserver), the low-level per-method decorators became a
    # generic add_request_handler registry, and mcp.types went snake_case.
    # See devs/MCP-2X-PORT.md for the full delta.
    "mcp>=2.0,<3",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    # >=8.4: caplog must capture through the non-propagating qmd_py logger
    # (create_mcp_server sets propagate=False; 8.4 added direct handler
    # attachment to non-propagating loggers).
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]
docs = [
    "zensical>=0.0.51",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.5",
    "mkdocs-click>=0.9.0",
]

[project.scripts]
marq = "qmd_py.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmd_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real Postgres/llama.cpp roundtrip tests (require MARQ_POSTGRES_URL/MARQ_LLM_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Teaches mypy how pydantic actually builds models: that BaseSettings
# fields can arrive from the environment (so `Settings()` with no
# arguments is legal), and that annotated field types coerce their
# inputs (so a plain `str` is accepted where a model wants `AnyUrl`).
# Without it, four call sites need `type: ignore` for things pydantic
# does correctly at runtime.
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions"]
