# Multi-model preset for llama.cpp's built-in `--models-preset` router,
# mirroring the real ubuserver.internal setup exactly (same section names/
# roles) so a local qmdpy dev environment can point at either
# interchangeably. Place the matching GGUF files in this directory
# (llm-stack/models/) - they are not checked into git (see .gitignore).
#
# A section's model file defaults to "<section-name>.gguf" in this
# directory unless a `model =` line overrides it.

[bge-m3-q8_0]
embeddings = true
batch-size = 4096
ubatch-size = 4096

[qwen2.5-3b-instruct-q4_k_m.gguf]
model = /models/qwen2.5-3b-instruct-q4_k_m.gguf

[qwen3-reranker-0.6b-q8_0]
model = /models/qwen3-reranker-0.6b-q8_0.gguf
reranking = true
